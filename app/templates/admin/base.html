<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Super-administration{% endblock %} · SmartShop</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>:root{ --accent:#075E54; }</style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="logo" style="display:flex;align-items:center;justify-content:center">🛡️</div>
      <div><h1>Super-administration</h1><div class="sub">Plateforme SmartShop</div></div>
      <div class="spacer"></div>
      <a href="/app/logout" title="Déconnexion">⎋</a>
    </div>
  </header>
  <main class="container page">
    <div class="pill-tabs">
      <a href="/admin" class="{% if active_tab=='overview' %}active{% endif %}">Vue globale</a>
      <a href="/admin/billing" class="{% if active_tab=='billing' %}active{% endif %}">Abonnements</a>
      <a href="/admin/shops" class="{% if active_tab=='shops' %}active{% endif %}">Boutiques</a>
      <a href="/admin/incidents" class="{% if active_tab=='incidents' %}active{% endif %}">Incidents</a>
      <a href="/admin/audit" class="{% if active_tab=='audit' %}active{% endif %}">Journal</a>
    </div>
    {% if flash %}<div class="flash ok">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
