<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abonnement & Paiement - BAOBAY</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .trial-banner {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }

        .trial-banner strong {
            display: block;
            color: #2e7d32;
            font-size: 16px;
            margin-top: 8px;
        }

        .trial-banner small {
            display: block;
            color: #558b2f;
            margin-top: 4px;
        }

        .plans-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .plan-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            text-align: left;
        }

        .plan-card:hover {
            border-color: #25d366;
            background: #f0f8f5;
        }

        .plan-card.selected {
            border: 2px solid #25d366;
            background: #f0f8f5;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .plan-name {
            font-weight: 600;
            color: #25d366;
            display: block;
            margin-bottom: 4px;
        }

        .plan-price {
            font-size: 18px;
            font-weight: bold;
            color: #25d366;
        }

        .plan-per-day {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            display: block;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .payment-method {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .payment-method:hover {
            border-color: #25d366;
            background: #f0f8f5;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.2);
        }

        .payment-method:active {
            transform: scale(0.98);
        }

        .support-banner {
            background: #fff3e0;
            border: 1px solid #ff9800;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #e65100;
        }

        .support-banner b {
            display: block;
            margin-bottom: 4px;
        }

        .primary {
            background: #25d366;
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
        }

        .primary:hover:not(:disabled) {
            filter: brightness(0.95);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
        }

        .primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: transparent;
            color: #25d366;
            border: 2px solid #25d366;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .secondary:hover {
            background: #f0f8f5;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.2);
        }

        .secondary:active {
            transform: scale(0.98);
        }

        .sticky-cta {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/app" class="icon-btn">←</a>
        <strong>Abonnement & Paiement</strong>
        <span class="top-spacer"></span>
    </header>

    <main class="container page">
        <section class="content">
            <div class="trial-banner">
                <div>✓</div>
                <strong>Vous avez 14 jours pour payer</strong>
                <small>Choisissez un plan ou continuez sans payer pour accéder au tableau de bord</small>
            </div>

            <h3>Choisissez votre plan</h3>
            <div class="plans-grid">
                <button class="plan-card" onclick="selectPlan('starter', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Démarrage</span>
                            <span class="plan-duration">1 mois</span>
                        </div>
                        <span class="plan-price">5 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">166 FCFA/jour</span>
                </button>

                <button class="plan-card" onclick="selectPlan('business', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Croissance</span>
                            <span class="plan-duration">3 mois</span>
                        </div>
                        <span class="plan-price">12 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">133 FCFA/jour • Économie 3 000 FCFA</span>
                </button>

                <button class="plan-card" onclick="selectPlan('premium', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Pro annuel</span>
                            <span class="plan-duration">12 mois</span>
                        </div>
                        <span class="plan-price">50 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">137 FCFA/jour • Économie 10 000 FCFA</span>
                </button>
            </div>

            <h3>Moyens de paiement</h3>
            <div class="payment-methods">
                <button class="payment-method" onclick="selectPaymentMethod('MTN', this)">📱 MTN Mobile Money</button>
                <button class="payment-method" onclick="selectPaymentMethod('ORANGE', this)">🟠 Orange Money</button>
                <button class="payment-method" onclick="selectPaymentMethod('AIRTEL', this)">💳 Airtel Money</button>
                <button class="payment-method" onclick="selectPaymentMethod('CARD', this)">💳 Carte bancaire</button>
            </div>

            <div class="support-banner">
                <b>Support :</b>
                +237 690088572
            </div>

            <button class="primary sticky-cta" id="confirmBtn" onclick="confirmPayment()" disabled>
                🔒 Confirmer et payer
            </button>

            <button class="secondary" onclick="skipPayment()">
                Continuer sans payer
            </button>
        </section>
    </main>

    <script>
        let selectedPlan = null;
        let selectedPaymentMethod = null;
        const SHOP_ID = {% if shop %}{{ shop.id }}{% else %}null{% endif %};

        function selectPlan(planName, element) {
            document.querySelectorAll('.plan-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedPlan = planName;
            document.getElementById('confirmBtn').disabled = false;
        }

        function selectPaymentMethod(method, element) {
            document.querySelectorAll('.payment-method').forEach(btn => {
                btn.style.borderColor = '';
                btn.style.background = '';
            });
            element.style.borderColor = '#25d366';
            element.style.background = '#f0f8f5';
            selectedPaymentMethod = method;
        }

        function confirmPayment() {
            if (!selectedPlan || !selectedPaymentMethod) {
                alert('Veuillez sélectionner un plan et une méthode de paiement');
                return;
            }

            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.textContent = 'Initiation du paiement...';

            const phone = prompt('Entrez votre numéro de téléphone (+237...)');

            if (!phone) {
                btn.disabled = false;
                btn.textContent = '🔒 Confirmer et payer';
                return;
            }

            // Appeler l'endpoint Campay
            fetch(`/api/billing/campay/initiate?shop_id=${SHOP_ID}&plan=${selectedPlan}&phone=${encodeURIComponent(phone)}&network=${selectedPaymentMethod}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Paiement initié! Veuillez compléter votre paiement sur votre téléphone.');
                    window.location.href = '/app/dashboard';
                } else {
                    alert('Erreur: ' + (data.error || 'Impossible d\'initier le paiement'));
                    btn.disabled = false;
                    btn.textContent = '🔒 Confirmer et payer';
                }
            })
            .catch(err => {
                alert('Erreur: ' + err.message);
                btn.disabled = false;
                btn.textContent = '🔒 Confirmer et payer';
            });
        }

        function skipPayment() {
            window.location.href = '/app/onboarding';
        }
    </script>
</body>
</html>
