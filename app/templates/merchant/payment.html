<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abonnement & Paiement - BAOBAY</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .trial-banner {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }

        .trial-banner strong {
            display: block;
            color: #2e7d32;
            font-size: 16px;
            margin-top: 8px;
        }

        .trial-banner small {
            display: block;
            color: #558b2f;
            margin-top: 4px;
        }

        .plans-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .plan-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            text-align: left;
        }

        .plan-card:hover {
            border-color: #25d366;
            background: #f0f8f5;
        }

        .plan-card.selected {
            border: 2px solid #25d366;
            background: #f0f8f5;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .plan-name {
            font-weight: 600;
            color: #25d366;
            display: block;
            margin-bottom: 4px;
        }

        .plan-price {
            font-size: 18px;
            font-weight: bold;
            color: #25d366;
        }

        .plan-per-day {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            display: block;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .payment-method {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .payment-method:hover {
            border-color: #25d366;
            background: #f0f8f5;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.2);
        }

        .payment-method:active {
            transform: scale(0.98);
        }

        .support-banner {
            background: #fff3e0;
            border: 1px solid #ff9800;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #e65100;
        }

        .support-banner b {
            display: block;
            margin-bottom: 4px;
        }

        .primary {
            background: #25d366;
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
        }

        .primary:hover:not(:disabled) {
            filter: brightness(0.95);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
        }

        .primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: transparent;
            color: #25d366;
            border: 2px solid #25d366;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .secondary:hover {
            background: #f0f8f5;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.2);
        }

        .secondary:active {
            transform: scale(0.98);
        }

        .sticky-cta {
            margin-bottom: 12px;
        }

        .payment-msg {
            display: none;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .payment-msg.err {
            display: block;
            background: #fdecea;
            border: 1px solid #e53935;
            color: #b71c1c;
        }

        .payment-msg.ok {
            display: block;
            background: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }

        .payment-msg.info {
            display: block;
            background: #e3f2fd;
            border: 1px solid #1e88e5;
            color: #0d47a1;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/app" class="icon-btn">←</a>
        <strong>Abonnement & Paiement</strong>
        <span class="top-spacer"></span>
    </header>

    <main class="container page">
        <section class="content">
            <div class="trial-banner">
                <div>✓</div>
                <strong>Vous avez 14 jours pour payer</strong>
                <small>Choisissez un plan ou continuez sans payer pour accéder au tableau de bord</small>
            </div>

            <h3>Choisissez votre plan</h3>
            <div class="plans-grid">
                <button class="plan-card" onclick="selectPlan('starter', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Démarrage</span>
                            <span class="plan-duration">1 mois</span>
                        </div>
                        <span class="plan-price">5 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">166 FCFA/jour</span>
                </button>

                <button class="plan-card" onclick="selectPlan('business', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Croissance</span>
                            <span class="plan-duration">3 mois</span>
                        </div>
                        <span class="plan-price">12 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">133 FCFA/jour • Économie 3 000 FCFA</span>
                </button>

                <button class="plan-card" onclick="selectPlan('premium', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Pro annuel</span>
                            <span class="plan-duration">12 mois</span>
                        </div>
                        <span class="plan-price">50 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">137 FCFA/jour • Économie 10 000 FCFA</span>
                </button>
            </div>

            <h3>Moyens de paiement</h3>
            <div class="payment-methods">
                <button class="payment-method" onclick="selectPaymentMethod('MTN', this)">📱 MTN Mobile Money</button>
                <button class="payment-method" onclick="selectPaymentMethod('ORANGE', this)">🟠 Orange Money</button>
                <button class="payment-method" onclick="selectPaymentMethod('AIRTEL', this)">💳 Airtel Money</button>
                <button class="payment-method" onclick="selectPaymentMethod('CARD', this)">💳 Carte bancaire</button>
            </div>

            <div class="support-banner">
                <b>Support :</b>
                +237 690088572
            </div>

            <div style="background: #f5f5f5; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                <label for="payment-phone" style="display: block; font-weight: 600; margin-bottom: 8px;">
                    Numéro de téléphone pour le paiement *
                </label>
                <input
                    id="payment-phone"
                    type="tel"
                    placeholder="+237690088572"
                    value="+237"
                    style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
                <small style="display: block; margin-top: 4px; color: #666;">
                    Entrez votre numéro MTN/Orange/Airtel pour initier le paiement
                </small>
            </div>

            <div id="payment-msg" class="payment-msg" role="status" aria-live="polite"></div>

            <button class="primary sticky-cta" id="confirmBtn" onclick="confirmPayment()" disabled>
                🔒 Confirmer et payer
            </button>

            <button class="secondary" onclick="skipPayment()">
                Continuer sans payer
            </button>
        </section>
    </main>

    <script>
        let selectedPlan = null;
        let selectedPaymentMethod = null;
        const SHOP_ID = {% if shop %}{{ shop.id }}{% else %}null{% endif %};

        function showMessage(text, kind) {
            const box = document.getElementById('payment-msg');
            box.className = 'payment-msg ' + kind;
            box.textContent = text;
        }

        function clearMessage() {
            const box = document.getElementById('payment-msg');
            box.className = 'payment-msg';
            box.textContent = '';
        }

        function digitsOf(value) {
            return (value || '').replace(/\D/g, '');
        }

        /** Le bouton ne s'active qu'une fois les trois champs renseignés. */
        function updateConfirmState() {
            const phoneOk = digitsOf(document.getElementById('payment-phone').value).length >= 9;
            document.getElementById('confirmBtn').disabled =
                !(selectedPlan && selectedPaymentMethod && phoneOk);
        }

        function selectPlan(planName, element) {
            document.querySelectorAll('.plan-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedPlan = planName;
            clearMessage();
            updateConfirmState();
        }

        function selectPaymentMethod(method, element) {
            document.querySelectorAll('.payment-method').forEach(btn => {
                btn.style.borderColor = '';
                btn.style.background = '';
            });
            element.style.borderColor = '#25d366';
            element.style.background = '#f0f8f5';
            selectedPaymentMethod = method;
            clearMessage();
            updateConfirmState();
        }

        function confirmPayment() {
            const btn = document.getElementById('confirmBtn');
            const phone = (document.getElementById('payment-phone').value || '').trim();

            if (!selectedPlan) {
                showMessage('Choisissez d\'abord un plan d\'abonnement.', 'err');
                return;
            }
            if (!selectedPaymentMethod) {
                showMessage('Choisissez un moyen de paiement (MTN, Orange, Airtel ou carte).', 'err');
                return;
            }
            if (digitsOf(phone).length < 9) {
                showMessage('Entrez un numéro de téléphone valide, ex. +237690088572.', 'err');
                return;
            }
            if (SHOP_ID === null) {
                showMessage('Votre boutique n\'est pas encore créée. Vous allez être redirigé…', 'err');
                setTimeout(() => { window.location.href = '/app/onboarding'; }, 1500);
                return;
            }

            const restore = () => {
                btn.disabled = false;
                btn.textContent = '🔒 Confirmer et payer';
            };

            btn.disabled = true;
            btn.textContent = 'Initiation du paiement…';
            showMessage('Initiation du paiement en cours…', 'info');

            const url = `/api/billing/campay/initiate?shop_id=${SHOP_ID}`
                + `&plan=${encodeURIComponent(selectedPlan)}`
                + `&phone=${encodeURIComponent(phone)}`
                + `&network=${encodeURIComponent(selectedPaymentMethod)}`;

            fetch(url, { method: 'POST', credentials: 'same-origin' })
                .then(res => res.json().catch(() => ({})).then(data => ({ res, data })))
                .then(({ res, data }) => {
                    if (res.ok && data.success) {
                        showMessage(
                            'Paiement initié. Confirmez la demande sur votre téléphone pour activer votre abonnement.',
                            'ok'
                        );
                        setTimeout(() => { window.location.href = '/app/dashboard'; }, 2500);
                        return;
                    }
                    // Remonter le motif réel renvoyé par le serveur plutôt qu'un
                    // message générique, sinon l'échec est impossible à diagnostiquer.
                    let reason = data.error || data.message;
                    if (!reason && Array.isArray(data.detail)) {
                        reason = data.detail.map(d => d.msg).join(', ');
                    }
                    reason = reason || data.detail || `Le serveur a répondu ${res.status}.`;
                    showMessage('Paiement impossible : ' + reason, 'err');
                    restore();
                })
                .catch(err => {
                    showMessage('Connexion au serveur impossible : ' + err.message, 'err');
                    restore();
                });
        }

        function skipPayment() {
            window.location.href = '/app/dashboard';
        }

        document.getElementById('payment-phone').addEventListener('input', () => {
            clearMessage();
            updateConfirmState();
        });
    </script>
</body>
</html>
