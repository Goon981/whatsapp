{# Courbe de ventes SVG. Variables : chart (dict de charts.line_chart), on_dark (bool). #}
{% set stroke = 'var(--surface)' if on_dark else 'var(--brand)' %}
{% set fill = 'rgba(255,255,255,0.18)' if on_dark else 'rgba(22,130,76,0.12)' %}
<svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" preserveAspectRatio="none" role="img" aria-label="Évolution des ventes">
  <path d="{{ chart.area }}" fill="{{ fill }}" stroke="none"/>
  <polyline points="{{ chart.points }}" fill="none" stroke="{{ stroke }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="{{ chart.last_x }}" cy="{{ chart.last_y }}" r="3.4" fill="{{ stroke }}"/>
</svg>
