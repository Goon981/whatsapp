<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop - Abonnement & Paiement</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .trial-banner {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }

        .trial-banner strong {
            display: block;
            color: #2e7d32;
            font-size: 16px;
            margin-top: 8px;
        }

        .trial-banner small {
            display: block;
            color: #558b2f;
            margin-top: 4px;
        }

        .plans-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .plan-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            text-align: left;
        }

        .plan-card:hover {
            border-color: #007a49;
            background: #f0f8f5;
        }

        .plan-card.selected {
            border: 2px solid #007a49;
            background: #f0f8f5;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .plan-name {
            font-weight: 600;
            color: #007a49;
            display: block;
            margin-bottom: 4px;
        }

        .plan-duration {
            font-size: 13px;
            color: #666;
            display: block;
        }

        .plan-price {
            font-size: 18px;
            font-weight: bold;
            color: #007a49;
        }

        .plan-per-day {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            display: block;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .payment-method {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
            font-size: 14px;
        }

        .payment-method:hover {
            border-color: #007a49;
            background: #f0f8f5;
        }

        .support-banner {
            background: #fff3e0;
            border: 1px solid #ff9800;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #e65100;
        }

        .support-banner b {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/app" class="icon-btn">←</a>
        <strong>Abonnement & Paiement</strong>
        <span class="top-spacer"></span>
    </header>

    <main class="container page">
        <section class="content">
            <!-- Trial Banner -->
            <div class="trial-banner">
                <div>✓</div>
                <strong>Vous avez 14 jours pour payer</strong>
                <small>Choisissez un plan ou continuez sans payer pour accéder au tableau de bord</small>
            </div>

            <!-- Plans Section -->
            <h3>Choisissez votre plan</h3>
            <div class="plans-grid">
                <!-- Starter Plan -->
                <button class="plan-card" onclick="selectPlan('starter', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Démarrage</span>
                            <span class="plan-duration">1 mois</span>
                        </div>
                        <span class="plan-price">5 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">166 FCFA/jour</span>
                </button>

                <!-- Business Plan -->
                <button class="plan-card" onclick="selectPlan('business', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Croissance</span>
                            <span class="plan-duration">3 mois</span>
                        </div>
                        <span class="plan-price">12 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">133 FCFA/jour • Économie 3 000 FCFA</span>
                </button>

                <!-- Premium Plan -->
                <button class="plan-card" onclick="selectPlan('premium', this)">
                    <div class="plan-header">
                        <div>
                            <span class="plan-name">Pro annuel</span>
                            <span class="plan-duration">12 mois</span>
                        </div>
                        <span class="plan-price">50 000 FCFA</span>
                    </div>
                    <span class="plan-per-day">137 FCFA/jour • Économie 10 000 FCFA</span>
                </button>
            </div>

            <!-- Payment Methods Section -->
            <h3>Moyens de paiement</h3>
            <div class="payment-methods">
                <button class="payment-method">📱 MTN Mobile Money</button>
                <button class="payment-method">🟠 Orange Money</button>
            </div>

            <!-- Support Banner -->
            <div class="support-banner">
                <b>Support :</b>
                +237 690088572
            </div>

            <!-- Confirm Button -->
            <button class="primary sticky-cta" id="confirmBtn" onclick="confirmPayment()" disabled>
                Confirmer le paiement
            </button>

            <!-- Skip Payment Button -->
            <button class="secondary" onclick="skipPayment()" style="width: 100%; padding: 14px; border: 2px solid #007a49; background: transparent; color: #007a49; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px;">
                Continuer sans payer
            </button>
        </section>
    </main>

    <script>
        let selectedPlan = null;

        function selectPlan(planName, element) {
            document.querySelectorAll('.plan-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedPlan = planName;
            document.getElementById('confirmBtn').disabled = false;
        }

        function confirmPayment() {
            if (!selectedPlan) return;

            const planNames = {
                'starter': 'Démarrage (5 000 FCFA)',
                'business': 'Croissance (12 000 FCFA)',
                'premium': 'Pro annuel (50 000 FCFA)'
            };

            alert('Plan sélectionné: ' + planNames[selectedPlan] + '\n\nEn prod, vous serez redirigé vers MTN MoMo ou Orange Money pour payer.');
        }

        function skipPayment() {
            window.location.href = '/app';
        }
    </script>
</body>
</html>
